<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Heart Disease Prediction</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{

    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:linear-gradient(-45deg,#0f2027,#203a43,#2c5364,#134E5E);
    background-size:400% 400%;
    animation:bgMove 15s ease infinite;
    overflow:auto;
    padding:40px;
}

@keyframes bgMove{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.container{

    width:100%;
    max-width:950px;

    background:rgba(255,255,255,.12);
    backdrop-filter:blur(20px);

    border:1px solid rgba(255,255,255,.2);

    border-radius:25px;

    padding:45px;

    box-shadow:
    0 15px 40px rgba(0,0,0,.35);

    animation:fade 1.2s ease;
}

@keyframes fade{

from{
opacity:0;
transform:translateY(30px);
}

to{

opacity:1;
transform:translateY(0);

}

}

h1{

text-align:center;
color:white;
margin-bottom:10px;
font-size:38px;

}

.subtitle{

text-align:center;
color:#d8f3ff;
margin-bottom:35px;

}

form{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;

}

.input-group{

display:flex;
flex-direction:column;

}

label{

color:white;
margin-bottom:8px;
font-weight:500;

}

input,select{

padding:15px;

border:none;
outline:none;

border-radius:12px;

background:rgba(255,255,255,.9);

font-size:15px;

transition:.3s;

}

input:focus,
select:focus{

transform:scale(1.02);

box-shadow:0 0 15px #6dd5fa;

}

.full{

grid-column:1/-1;

}

button{

grid-column:1/-1;

padding:18px;

font-size:18px;

font-weight:600;

border:none;

cursor:pointer;

border-radius:15px;

background:linear-gradient(90deg,#00c6ff,#0072ff);

color:white;

transition:.4s;

}

button:hover{

transform:translateY(-4px);

box-shadow:0 15px 25px rgba(0,114,255,.45);

}

@media(max-width:768px){

form{

grid-template-columns:1fr;

}

}

</style>

</head>
<body>

<div class="container">

<h1>❤️ Heart Disease Prediction</h1>

<p class="subtitle">
Fill in the patient's clinical details to predict the risk of heart disease.
</p>

<form action="{{url_for('predict')}}" method="POST">

<div class="input-group">
<label>Age</label>
<input type="number" name="Age" required>
</div>

<div class="input-group">
<label>Sex</label>
<select name="Sex">
<option value="1">Male</option>
<option value="0">Female</option>
</select>
</div>

<div class="input-group">
<label>Chest Pain Type</label>
<select name="Chest pain type">
<option value="1">Typical Angina</option>
<option value="2">Atypical Angina</option>
<option value="3">Non-anginal Pain</option>
<option value="4">Asymptomatic</option>
</select>
</div>

<div class="input-group">
<label>Blood Pressure (BP)</label>
<input type="number" name="BP" required>
</div>

<div class="input-group">
<label>Cholesterol</label>
<input type="number" name="Cholesterol" required>
</div>

<div class="input-group">
<label>FBS Over 120</label>
<select name="FBS over 120">
<option value="1">Yes</option>
<option value="0">No</option>
</select>
</div>

<div class="input-group">
<label>EKG Results</label>
<select name="EKG results">
<option value="0">Normal</option>
<option value="1">ST-T Wave Abnormality</option>
<option value="2">Left Ventricular Hypertrophy</option>
</select>
</div>

<div class="input-group">
<label>Maximum Heart Rate</label>
<input type="number" name="Max HR" required>
</div>

<div class="input-group">
<label>Exercise Induced Angina</label>
<select name="Exercise angina">
<option value="1">Yes</option>
<option value="0">No</option>
</select>
</div>

<div class="input-group">
<label>ST Depression</label>
<input type="number" step="0.1" name="ST depression" required>
</div>

<div class="input-group">
<label>Slope of ST</label>
<select name="Slope of ST">
<option value="1">Upsloping</option>
<option value="2">Flat</option>
<option value="3">Downsloping</option>
</select>
</div>

<div class="input-group">
<label>Number of Major Vessels</label>
<input type="number" min="0" max="3" name="Number of vessels fluro" required>
</div>

<div class="input-group full">
<label>Thallium Test</label>
<select name="Thallium">
<option value="3">Normal</option>
<option value="6">Fixed Defect</option>
<option value="7">Reversible Defect</option>
</select>
</div>

<button type="submit">
🚀 Predict Heart Disease
</button>

</form>

</div>

</body>
</html>
